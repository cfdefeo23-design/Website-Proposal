<label>Email<br><input id="editEmail" value="ceedeedefeo@gmail.com" style="width:100%;padding:10px"></label><br><br>
<label>Address<br><input id="editAddress" value="2061 A. Francisco St., Sta. Ana, Manila" style="width:100%;padding:10px"></label><br><br>
<button onclick="saveContacts()" style="padding:12px 20px;background:#2B2B2B;color:#fff;border:none;border-radius:999px;cursor:pointer">Save Contact Details</button>
<button onclick="resetContacts()" style="padding:12px 20px;background:#fff;border:1px solid #ddd;border-radius:999px;cursor:pointer">Reset</button>
<p id="saveMsg" style="color:green"></p></div>
<script>
function saveContacts(){var p=document.getElementById('editPhone').value;var e=document.getElementById('editEmail').value;var a=document.getElementById('editAddress').value;localStorage.setItem('cristina_phone',p);localStorage.setItem('cristina_email',e);localStorage.setItem('cristina_address',a);document.querySelectorAll('[data-contact="phone"]').forEach(el=>el.textContent=p);document.querySelectorAll('[data-contact="email"]').forEach(el=>el.textContent=e);document.querySelectorAll('[data-contact="address"]').forEach(el=>el.textContent=a);document.getElementById('saveMsg').textContent='Saved! Contacts updated on this page.';}
function resetContacts(){localStorage.removeItem('cristina_phone');localStorage.removeItem('cristina_email');localStorage.removeItem('cristina_address');location.reload();}
window.addEventListener('DOMContentLoaded',function(){var p=localStorage.getItem('cristina_phone');var e=localStorage.getItem('cristina_email');var a=localStorage.getItem('cristina_address');if(p){document.querySelectorAll('[data-contact="phone"]').forEach(el=>el.textContent=p);document.getElementById('editPhone').value=p;}if(e){document.querySelectorAll('[data-contact="email"]').forEach(el=>el.textContent=e);document.getElementById('editEmail').value=e;}if(a){document.querySelectorAll('[data-contact="address"]').forEach(el=>el.textContent=a);document.getElementById('editAddress').value=a;}});
</script>
</body>
</html>
